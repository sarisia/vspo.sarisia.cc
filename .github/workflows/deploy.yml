name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Build frontend
        run: npm ci && npm run build

      - name: Generate token for pages repo
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GITHUBAPP_ID }}
          private-key: ${{ secrets.GITHUBAPP_PRIVATE_KEY }}
          owner: vspo-sarisia-cc
          repositories: vspo-sarisia-cc.github.io

      - name: Checkout pages repo
        uses: actions/checkout@v3
        with:
          repository: vspo-sarisia-cc/vspo-sarisia-cc.github.io
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: pages

      - name: Publish frontend to main
        run: |
          set -euo pipefail
          rm -rf build/data                       # data dir is owned by refresh.yml
          echo "vspo.sarisia.cc" > build/CNAME
          git -C pages config user.name "mntaqua"
          git -C pages config user.email "91774192+mntaqua@users.noreply.github.com"

          rsync -a --delete --exclude data build/ pages/   # replace shell, keep data/
          git -C pages add -A
          git -C pages commit -m "deploy: frontend ${GITHUB_SHA::7}" || { echo "no changes"; exit 0; }
          git -C pages push origin main

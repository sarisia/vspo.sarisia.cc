name: Refresh stream data

on:
  schedule:
    # Runs every 15 minutes (GitHub Actions cron minimum is 5 min; actual timing is best-effort)
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Generate data
        run: npm ci && npm run generate
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCASTING_ACCESS_TOKEN: ${{ secrets.TWITCASTING_ACCESS_TOKEN }}

      - name: Generate token for pages repo
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GITHUBAPP_ID }}
          private-key: ${{ secrets.GITHUBAPP_PRIVATE_KEY }}
          owner: vspo-sarisia-cc
          repositories: vspo-sarisia-cc.github.io

      - name: Checkout pages repo
        uses: actions/checkout@v3
        with:
          repository: vspo-sarisia-cc/vspo-sarisia-cc.github.io
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: pages

      - name: Publish data to main
        run: |
          set -euo pipefail
          git -C pages config user.name "mntaqua"
          git -C pages config user.email "91774192+mntaqua@users.noreply.github.com"

          mkdir -p pages/data
          rsync -a data/ pages/data/              # add/update; NO --delete → keep history
          git -C pages add -A
          git -C pages commit -m "refresh: data $(date -u +%FT%TZ)" || { echo "no changes"; exit 0; }
          git -C pages push origin main
